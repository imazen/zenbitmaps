[package]
name = "zenbitmaps"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "PNM/PAM/PFM, BMP, farbfeld, QOI, TGA, and Radiance HDR image codec"
categories = ["multimedia::images"]
keywords = ["image", "pnm", "bmp", "tga", "qoi"]
repository = "https://github.com/imazen/zenbitmaps"
documentation = "https://docs.rs/zenbitmaps"
readme = "README.crates.md"
include = [
    "/src/**",
    "/README.crates.md",
    "/CHANGELOG.md",
    "/LICENSE*",
]

[dependencies]
# Core (always available)
enough = "0.4.4"
imgref = { version = "1.12.3", default-features = false, optional = true }
rgb = { version = "0.8.53", default-features = false, features = ["as-bytes"], optional = true }
thiserror = { version = "2.0.21", default-features = false }
whereat = { version = "0.1.5", default-features = false }
zencodec = { version = ">=0.1.26, <0.3.0", optional = true }
# zennode is not yet published; uncomment when it's on crates.io
# zennode = { path = "../zennode/zennode", default-features = false, features = ["derive"], optional = true }
zenpixels = { version = ">=0.2.13, <0.4.0", default-features = false, features = ["imgref"], optional = true }
# Load-bearing descriptor narrowing for the zencodec encode path — raw
# formats pay full price for dead lanes, so the reduction wins more here
# than for any entropy-coded codec.
zenpixels-convert = { version = ">=0.2.13, <0.4.0", default-features = false, optional = true }
# SIMD acceleration
archmage = { version = "0.9.29", default-features = false, optional = true }
garb = { version = "0.2.8", default-features = false, optional = true }

[dev-dependencies]
archmage = { version = "0.9.29", features = ["std", "testable_dispatch"] }
zenutils-fuzz = "0.1.0"
zenbench = "0.1.10"
# zencodec conformance harness. Provides check_decode_truncation_series
# (EOF/truncation). The PUBLISHED testkit 0.1.0 declares `zencodec ^0.1.26`,
# which unifies with the [dependencies] entry above on one crates.io zencodec
# today — but that caret will NOT admit zencodec 0.2.0, so testkit must
# republish with its own widened `>=0.1.26, <0.3.0` (already in its manifest,
# zencodec repo `4391021`) before 0.2.0 ships, or this dev-dep graph gains a
# second zencodec copy.
zencodec-testkit = ">=0.1.0, <0.3.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
codec-corpus = "1.1.0"

[features]
default = []
std = ["enough/std", "whereat/std"]

# Format groups
bmp = []   # Full BMP support (all bit depths, RLE, bitfields, palettes)
hdr = []   # Radiance HDR/RGBE format support
tga = []   # TGA (Targa) format support
qoi = []  # QOI codec (vendored core in src/qoi/rapid_qoi)
simd = ["dep:garb", "dep:archmage"]  # SIMD acceleration

# Typed pixel support
rgb = ["dep:rgb"]              # RGB8, RGBA8 etc. typed pixel encode/decode
imgref = ["dep:imgref", "rgb"] # ImgVec/ImgRef 2D buffer support (implies rgb)

# zencodec trait integration
zencodec = ["dep:zencodec", "dep:zenpixels", "dep:zenpixels-convert", "imgref", "rgb"]

# zennode node definitions (EncodeBmp schema with RIAPI keys)
# Disabled until zennode is published to crates.io
# zennode = ["dep:zennode"]

# All optional features
all = ["bmp", "qoi", "tga", "hdr", "simd", "rgb", "imgref"]

[[bench]]
name = "codecs"
harness = false
required-features = ["bmp", "qoi", "tga", "hdr", "simd"]


[[bench]]
name = "swizzle"
harness = false
required-features = ["simd"]
