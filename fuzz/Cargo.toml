[package]
name = "zenbitmaps-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
enough = "0.4"
zencodec = { version = ">=0.2.0, <0.4.0" }

[dependencies.zenbitmaps]
path = ".."
features = ["bmp", "qoi", "tga", "hdr", "inventory"]

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false
bench = false

# zencodec's Pulse operation controls (zencodec 0.2, ideal-api 79676215), the
# same revision the root manifest pins; swap for the release before merge.
[patch.crates-io]
zencodec = { git = "https://github.com/imazen/zencodec", rev = "feb09f9fd25e90e49a30d7161db8f3b558dfb2a6" }
